router:
  default_provider: nvidia_nim
  fallback_provider: ollama
  models:
    - id: claude-opus-4
      provider: anthropic
      max_tokens: 8192
      temperature: 0.0
      cost_per_1k_input: 0.015
      cost_per_1k_output: 0.075
      capabilities: [planning, architecture, complex_reasoning, think_tool]
      api_key_env: ANTHROPIC_API_KEY
      
    - id: claude-sonnet-4
      provider: anthropic
      max_tokens: 8192
      temperature: 0.0
      cost_per_1k_input: 0.003
      cost_per_1k_output: 0.015
      capabilities: [code_generation, review, think_tool, debugging]
      api_key_env: ANTHROPIC_API_KEY
      
    - id: claude-3-5-sonnet
      provider: anthropic
      max_tokens: 8192
      temperature: 0.0
      cost_per_1k_input: 0.003
      cost_per_1k_output: 0.015
      capabilities: [code_generation, review, test_generation, think_tool]
      api_key_env: ANTHROPIC_API_KEY
      
    - id: claude-3-5-haiku
      provider: anthropic
      max_tokens: 8192
      temperature: 0.0
      cost_per_1k_input: 0.00025
      cost_per_1k_output: 0.00125
      capabilities: [classification, triage, docs, simple_tasks]
      api_key_env: ANTHROPIC_API_KEY
      
    - id: llama-3.1-8b
      provider: ollama
      local: true
      base_url: http://ollama:11434
      max_tokens: 4096
      temperature: 0.1
      cost_per_1k_input: 0.0
      cost_per_1k_output: 0.0
      capabilities: [simple_tasks, embeddings, classification]
      
    - id: llama-3.1-70b
      provider: ollama
      local: true
      base_url: http://ollama:11434
      max_tokens: 8192
      temperature: 0.0
      cost_per_1k_input: 0.0
      cost_per_1k_output: 0.0
      capabilities: [code_generation, review, planning]

    # NVIDIA NIM Cloud (OpenAI-compatible). This is the default for all
    # configured agent capabilities below.
    - id: nvidia/nemotron-3-ultra-550b-a55b
      provider: nvidia_nim
      api_key_env: NVIDIA_API_KEY
      base_url: https://integrate.api.nvidia.com/v1
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
      capabilities: [planning, architecture, code_generation, code_review, test_generation, classification, triage, documentation, simple_tasks, think_tool, review, debugging, docs, complex_reasoning]

    # OpenAI API example. Set your preferred model ID and route capabilities.
    - id: gpt-4.1
      provider: openai
      api_key_env: OPENAI_API_KEY
      max_tokens: 8192
      temperature: 0.0
      capabilities: [planning, architecture, code_generation, code_review, test_generation]
      
  routing_rules:
    planning: nvidia/nemotron-3-ultra-550b-a55b
    architecture: nvidia/nemotron-3-ultra-550b-a55b
    code_generation: nvidia/nemotron-3-ultra-550b-a55b
    code_review: nvidia/nemotron-3-ultra-550b-a55b
    think_tool: nvidia/nemotron-3-ultra-550b-a55b
    test_generation: nvidia/nemotron-3-ultra-550b-a55b
    classification: nvidia/nemotron-3-ultra-550b-a55b
    triage: nvidia/nemotron-3-ultra-550b-a55b
    documentation: nvidia/nemotron-3-ultra-550b-a55b
    simple_tasks: nvidia/nemotron-3-ultra-550b-a55b
